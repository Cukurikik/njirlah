openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NJIRLAH AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cloudflare
    description: Cloudflare Workers AI operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cloudflare/models:
    get:
      operationId: getCloudflareModels
      tags: [cloudflare]
      summary: Get Cloudflare Workers AI models
      description: Returns list of available text-generation models from Cloudflare
      responses:
        "200":
          description: List of Cloudflare models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareModelsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CloudflareModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        task:
          type: object
          properties:
            name:
              type: string
          required:
            - name
      required:
        - id
        - name

    CloudflareModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/CloudflareModel"
      required:
        - models

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
